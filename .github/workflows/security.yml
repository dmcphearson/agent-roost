# Leak and code checks from dmcphearson/.github; main's ruleset requires both to pass.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: dmcphearson/.github/.github/workflows/pr-security.yml@main
    permissions:
      contents: read
      actions: read
      security-events: write
    secrets:
      LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
